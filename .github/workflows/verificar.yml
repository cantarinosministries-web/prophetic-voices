name: Verificar site
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: python3 tests/integridade.py
      - run: node --test tests/*.test.js
      - run: npx wrangler d1 migrations apply pv-db --local
